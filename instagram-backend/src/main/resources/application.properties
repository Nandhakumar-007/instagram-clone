# ===== App name =====
spring.application.name=instagram-backend

# ===== Server =====
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/instagram_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=nandha@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate = checks entities match your existing tables, changes nothing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== File upload (for post images/videos) =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads

